<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="theme-color" content="#ffffff">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>textX Playground</title>
    <script>
      // Theme shared with textx.org through a cookie on Domain=textx.org (see src/utils/theme.ts).
      // Runs before first paint: the explicit choice or the system setting. On *.textx.org only the
      // shared cookie counts (no cookie = "Auto" picked on the site); elsewhere localStorage is used.
      (function () {
        var m = document.cookie.match(/(?:^|; )textx-theme=(light|dark)/);
        var shared = /(^|\.)textx\.org$/.test(location.hostname);
        var stored = null;
        try { stored = shared ? null : localStorage.getItem('theme'); } catch (e) {}
        var theme = (m && m[1]) || stored || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
